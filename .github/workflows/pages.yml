name: Publish asset previews

on:
  push:
    branches: [items]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble galleries with their local assets
        run: |
          mkdir -p _site/assets/tomes _site/assets/items
          cp -a docs/. _site/
          cp -a assets/review _site/assets/
          cp -a assets/tomes/cards-authored _site/assets/tomes/
          cp -a assets/items/redesign-distinct-15 _site/assets/items/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
